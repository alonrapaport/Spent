  <style>
    :root {
      --cream: #fbf7f2;
      --cream-deep: #f3e9df;
      --card: #fffdfb;
      --ink: #5a4a42;
      --ink-soft: #8a7a70;
      --pink: #e2b6b0;
      --pink-deep: #c0817b;
      --sage: #a6b58e;
      --sage-deep: #7f9168;
      --yellow: #f1dfa6;
      --line: #ecdfd4;
      --shadow: 28px 28px 60px rgba(143, 116, 99, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Assistant", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 100% 0%, #fdf3ee 0%, rgba(253, 243, 238, 0) 55%),
        radial-gradient(120% 80% at 0% 100%, #f0f3e8 0%, rgba(240, 243, 232, 0) 55%),
        var(--cream);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px 48px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 30px;
      padding: 32px 32px 40px;
      box-shadow: var(--shadow);
      overflow: hidden;
      text-align: center;
      isolation: isolate;
    }

    /* soft botanical corners */
    .leaf {
      position: absolute;
      width: 150px;
      height: 150px;
      opacity: 0.5;
      z-index: -1;
      pointer-events: none;
    }
    .leaf--top { top: -26px; left: -30px; transform: rotate(8deg); }
    .leaf--bottom { bottom: -30px; right: -28px; transform: rotate(186deg); }

    /* delicate illustrated background: pacifier, teddy, bagel, cheese, smoked salmon */
    .motif-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .page-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.3;
    }
    .bg-pattern {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
    }
    .page-bg svg, .bg-pattern svg { width: 100%; height: 100%; display: block; }

    .eyebrow {
      font-size: 14px;
      letter-spacing: 0.14em;
      color: var(--sage-deep);
      font-weight: 600;
      margin-bottom: 18px;
    }

    .intro {
      font-size: 16.5px;
      color: var(--ink);
      max-width: 32ch;
      margin: 0 auto 6px;
      text-wrap: balance;
    }
    .intro strong { color: var(--ink); font-weight: 600; }

    .name {
      font-family: "Frank Ruhl Libre", serif;
      font-weight: 900;
      font-size: clamp(38px, 12vw, 56px);
      line-height: 1.05;
      color: var(--pink-deep);
      margin: 10px 0 6px;
      letter-spacing: 0.01em;
    }

    .name-sub {
      font-size: 14px;
      letter-spacing: 0.22em;
      color: var(--sage-deep);
      font-weight: 600;
      text-transform: none;
      margin-bottom: 22px;
    }

    .photo-frame {
      width: 150px;
      height: 150px;
      margin: 4px auto 18px;
      border-radius: 50%;
      padding: 8px;
      background: linear-gradient(135deg, var(--pink) 0%, var(--yellow) 55%, var(--sage) 100%);
      box-shadow: 0 14px 30px rgba(192, 129, 123, 0.28);
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--card);
      display: block;
    }

    .warm {
      font-size: 16.5px;
      color: var(--ink);
      max-width: 32ch;
      margin: 0 auto;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 20px auto;
      max-width: 260px;
      color: var(--pink);
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--line), transparent);
    }
    .divider svg { width: 26px; height: 26px; flex: none; }

    .countdown {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 auto 18px;
      padding: 7px 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fdf2cf 0%, #f8e6ad 100%);
      border: 1px solid #eed9a0;
      color: #8a6d2f;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 6px 16px rgba(214, 184, 110, 0.25);
    }
    .countdown svg { width: 16px; height: 16px; flex: none; }
    .countdown[hidden] { display: none; }

    .details {
      background: linear-gradient(180deg, #fffaf4 0%, #fdf4ec 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px 22px;
      margin: 4px 0 24px;
      text-align: right;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 0;
    }
    .row + .row { border-top: 1px dashed var(--line); }
    .row .icon {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 4px 12px rgba(143, 116, 99, 0.12);
      color: var(--pink-deep);
    }
    .row .icon svg { width: 22px; height: 22px; }
    .row .text { line-height: 1.35; }
    .row .label {
      font-size: 12.5px;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      font-weight: 600;
    }
    .row .value { font-size: 17px; font-weight: 600; color: var(--ink); }
    .row .value small { font-weight: 400; color: var(--ink-soft); font-size: 14px; }

    .icon-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 30px;
    }
    .btn-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(143, 116, 99, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-icon svg { width: 25px; height: 25px; }
    .btn-icon:hover { transform: translateY(-2px); }
    .btn-icon:active { transform: translateY(0); }

    .btn--waze {
      background: var(--sage-deep);
      color: #fff;
      box-shadow: 0 10px 22px rgba(127, 145, 104, 0.32);
    }
    .btn--maps {
      background: #fff;
      color: var(--pink-deep);
      border: 1.5px solid var(--pink);
    }
    .btn--cal {
      background: linear-gradient(180deg, #fdf2cf 0%, #f8e6ad 100%);
      color: #8a6d2f;
      border: 1.5px solid #ecd9a3;
    }
    .btn--share {
      background: #fff;
      color: var(--sage-deep);
      border: 1.5px solid var(--sage);
    }

    .signoff {
      font-size: 16px;
      color: var(--ink-soft);
    }
    .signoff .parents {
      font-family: "Frank Ruhl Libre", serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--pink-deep);
      margin-top: 4px;
    }

    /* gentle entrance */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .reveal:nth-child(1) { animation-delay: 0.05s; }
    .card > .reveal:nth-child(2) { animation-delay: 0.12s; }
    .card > .reveal:nth-child(3) { animation-delay: 0.19s; }
    .card > .reveal:nth-child(4) { animation-delay: 0.26s; }
    .card > .reveal:nth-child(5) { animation-delay: 0.33s; }
    .card > .reveal:nth-child(6) { animation-delay: 0.4s; }
    .card > .reveal:nth-child(7) { animation-delay: 0.47s; }
    .card > .reveal:nth-child(8) { animation-delay: 0.54s; }
    .card > .reveal:nth-child(9) { animation-delay: 0.61s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* one-time celebratory hearts on load */
    .hearts {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }
    .hearts span {
      position: absolute;
      bottom: -40px;
      aspect-ratio: 1;
      opacity: 0;
      animation: floatUp 4.2s ease-in forwards;
    }
    .hearts svg { width: 100%; height: 100%; display: block; }
    .hearts span:nth-child(1)  { left: 6%;  width: 18px; animation-delay: 0.10s; animation-duration: 4.4s; }
    .hearts span:nth-child(2)  { left: 18%; width: 26px; animation-delay: 0.50s; animation-duration: 3.8s; }
    .hearts span:nth-child(3)  { left: 30%; width: 16px; animation-delay: 0.00s; animation-duration: 4.8s; }
    .hearts span:nth-child(4)  { left: 42%; width: 22px; animation-delay: 0.80s; animation-duration: 4.0s; }
    .hearts span:nth-child(5)  { left: 54%; width: 28px; animation-delay: 0.30s; animation-duration: 4.6s; }
    .hearts span:nth-child(6)  { left: 64%; width: 17px; animation-delay: 1.00s; animation-duration: 3.9s; }
    .hearts span:nth-child(7)  { left: 74%; width: 24px; animation-delay: 0.20s; animation-duration: 4.5s; }
    .hearts span:nth-child(8)  { left: 84%; width: 19px; animation-delay: 0.70s; animation-duration: 4.1s; }
    .hearts span:nth-child(9)  { left: 92%; width: 22px; animation-delay: 0.45s; animation-duration: 4.7s; }
    .hearts span:nth-child(10) { left: 48%; width: 15px; animation-delay: 1.20s; animation-duration: 4.3s; }

    @keyframes floatUp {
      0%   { opacity: 0;    transform: translateY(0) scale(0.7) rotate(0deg); }
      12%  { opacity: 0.85; }
      80%  { opacity: 0.85; }
      100% { opacity: 0;    transform: translateY(-112vh) scale(1) rotate(14deg); }
    }

    @media (max-width: 380px) {
      .card { padding: 28px 22px 34px; }
      .photo-frame { width: 132px; height: 132px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; transform: none; }
      .btn-icon { transition: none; }
      .hearts { display: none; }
    }
  </style>
</head>

  <script>
    (function () {
      // Countdown to the celebration (26 June 2026)
      try {
        var el = document.getElementById("countdown");
        var txt = document.getElementById("countdown-text");
        if (el && txt) {
          var target = new Date(2026, 5, 26);
          var now = new Date();
          var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          var days = Math.round((target - today) / 86400000);
          var msg = "";
          if (days > 2) msg = "עוד " + days + " ימים";
          else if (days === 2) msg = "עוד יומיים";
          else if (days === 1) msg = "עוד יום אחד";
          else if (days === 0) msg = "החגיגה היום!";
          if (msg) { txt.textContent = msg; el.hidden = false; }
        }
      } catch (e) {}

      // Share the invitation
      try {
        var btn = document.getElementById("shareBtn");
        if (btn) {
          var original = btn.innerHTML;
          var check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
          btn.addEventListener("click", function () {
            var data = {
              title: document.title,
              text: "הוזמנתם לחגוג את הולדת ליבי שמחה",
              url: location.href
            };
            if (navigator.share) {
              navigator.share(data).catch(function () {});
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(location.href).then(function () {
                btn.innerHTML = check;
                btn.setAttribute("aria-label", "הקישור הועתק");
                setTimeout(function () {
                  btn.innerHTML = original;
                  btn.setAttribute("aria-label", "שיתוף");
                }, 1800);
              }).catch(function () {});
            }
          });
        }
      } catch (e) {}
    })();
  </script>
